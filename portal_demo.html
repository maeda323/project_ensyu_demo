<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無人化ポータル（カーソル周辺だけ無人画像に差し替え）デモ</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:20px;}
    .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
    .card{border:1px solid #ddd;border-radius:12px;padding:12px;box-shadow:0 1px 8px rgba(0,0,0,.05);}
    canvas{border:1px solid #ccc;border-radius:12px;max-width:100%;height:auto;}
    label{display:block;margin:8px 0 4px;font-size:14px;}
    input[type="range"]{width:260px;}
    .hint{color:#555;font-size:13px;line-height:1.5;max-width:780px;}
    .small{font-size:12px;color:#666;}
    button{padding:8px 10px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;}
    button:hover{background:#f6f6f6;}
  </style>
</head>
<body>
  <h2>無人化ポータル（PCデモ）</h2>
  <p class="hint">
    「PC画面＝現実」「カーソル周辺＝スマホ画面」という仮定で、<b>人混み画像（ベース）</b>の上に、<b>無人画像</b>をカーソル周辺だけ差し替えて表示します。<br>
    まずは 2枚の画像を読み込んでください（同じ場所・同じ構図だと綺麗に見えます）。
  </p>

  <div class="row">
    <div class="card">
      <label>1) 人混みの画像（ベース）</label>
      <input id="crowdFile" type="file" accept="image/*" />

      <label>2) 無人の画像（Clean Plate）</label>
      <input id="emptyFile" type="file" accept="image/*" />

      <label>ポータル半径（px）: <span id="radiusLabel">80</span></label>
      <input id="radius" type="range" min="20" max="240" value="80" />

      <label>縁のぼかし（フェザー）（px）: <span id="featherLabel">18</span></label>
      <input id="feather" type="range" min="0" max="100" value="18" />

      <label>ポータル形状</label>
      <select id="shape">
        <option value="circle" selected>円（おすすめ）</option>
        <option value="rect">四角</option>
      </select>

      <label>表示モード</label>
      <select id="mode">
        <option value="portal" selected>カーソル周辺だけ無人化</option>
        <option value="wipe">左右ワイプ（比較用）</option>
        <option value="toggle">全体トグル（比較用）</option>
      </select>

      <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;">
        <button id="fitBtn" type="button">キャンバスに合わせて表示</button>
        <button id="downloadBtn" type="button">スクショ保存（PNG）</button>
        <span class="small">※マウスをキャンバス上で動かして確認</span>
      </div>

      <p class="small" style="margin-top:10px;max-width:520px;">
        コツ：2枚が少しズレる場合は、撮影時に「同じ位置・同じ画角」で撮るほど自然になります。<br>
        発表用なら、まず固定（その場でかざす）に寄せると確実に見せられます。
      </p>
    </div>

    <div class="card">
      <canvas id="canvas" width="960" height="540"></canvas>
      <div class="small" id="status" style="margin-top:8px;">画像を読み込むとここに表示されます。</div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const crowdFile = document.getElementById('crowdFile');
  const emptyFile = document.getElementById('emptyFile');
  const radius = document.getElementById('radius');
  const feather = document.getElementById('feather');
  const radiusLabel = document.getElementById('radiusLabel');
  const featherLabel = document.getElementById('featherLabel');
  const shape = document.getElementById('shape');
  const mode = document.getElementById('mode');
  const status = document.getElementById('status');
  const fitBtn = document.getElementById('fitBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  const crowdImg = new Image();
  const emptyImg = new Image();

  let hasCrowd = false, hasEmpty = false;
  let mouse = {x: canvas.width/2, y: canvas.height/2, inside:false};
  let showEmptyAll = false;

  // offscreen for masking
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');

  function setStatus(msg){ status.textContent = msg; }

  function loadImageFromFile(input, img, onReady){
    const file = input.files && input.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      onReady();
    };
    img.src = url;
  }

  function resizeCanvasToFit(){
    // Fit to crowd image if available, otherwise keep default
    const base = hasCrowd ? crowdImg : (hasEmpty ? emptyImg : null);
    if(!base) return;

    // Limit huge images for performance
    const maxW = 1280;
    const maxH = 720;
    let w = base.naturalWidth;
    let h = base.naturalHeight;
    const scale = Math.min(maxW / w, maxH / h, 1);
    w = Math.round(w * scale);
    h = Math.round(h * scale);

    canvas.width = w;
    canvas.height = h;
    off.width = w;
    off.height = h;
    mouse.x = w/2; mouse.y = h/2;
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(!(hasCrowd || hasEmpty)){
      // Placeholder
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#777';
      ctx.font = '16px system-ui';
      ctx.fillText('画像を読み込んでください', 20, 32);
      requestAnimationFrame(draw);
      return;
    }

    // Base layer
    const baseImg = (showEmptyAll && hasEmpty) ? emptyImg : (hasCrowd ? crowdImg : emptyImg);
    ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);

    if(hasEmpty && mode.value === 'portal'){
      // Create portal mask and composite empty image inside
      const r = Number(radius.value);
      const f = Number(feather.value);

      offCtx.clearRect(0,0,off.width,off.height);
      // draw empty image full
      offCtx.drawImage(emptyImg, 0, 0, off.width, off.height);

      // Apply mask
      offCtx.globalCompositeOperation = 'destination-in';
      offCtx.beginPath();
      if(shape.value === 'circle'){
        // feather via radial gradient
        const g = offCtx.createRadialGradient(mouse.x, mouse.y, Math.max(0, r - f), mouse.x, mouse.y, r);
        g.addColorStop(0, 'rgba(255,255,255,1)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        offCtx.fillStyle = g;
        offCtx.arc(mouse.x, mouse.y, r, 0, Math.PI*2);
        offCtx.fill();
      } else {
        // rect + feather using gradient edges (simple approximation)
        const x0 = mouse.x - r;
        const y0 = mouse.y - r;
        const w = r*2;
        const h = r*2;
        // draw hard rect then blur edges by drawing a bigger gradient rect
        offCtx.rect(x0, y0, w, h);
        offCtx.fillStyle = 'rgba(255,255,255,1)';
        offCtx.fill();
        if(f>0){
          offCtx.globalCompositeOperation = 'destination-in';
          const gx = offCtx.createLinearGradient(x0 - f, 0, x0 + f, 0);
          gx.addColorStop(0, 'rgba(255,255,255,0)');
          gx.addColorStop(1, 'rgba(255,255,255,1)');
          offCtx.fillStyle = gx;
          offCtx.fillRect(x0 - f, y0 - f, f*2, h + f*2);

          const gx2 = offCtx.createLinearGradient(x0 + w - f, 0, x0 + w + f, 0);
          gx2.addColorStop(0, 'rgba(255,255,255,1)');
          gx2.addColorStop(1, 'rgba(255,255,255,0)');
          offCtx.fillStyle = gx2;
          offCtx.fillRect(x0 + w - f, y0 - f, f*2, h + f*2);

          const gy = offCtx.createLinearGradient(0, y0 - f, 0, y0 + f);
          gy.addColorStop(0, 'rgba(255,255,255,0)');
          gy.addColorStop(1, 'rgba(255,255,255,1)');
          offCtx.fillStyle = gy;
          offCtx.fillRect(x0 - f, y0 - f, w + f*2, f*2);

          const gy2 = offCtx.createLinearGradient(0, y0 + h - f, 0, y0 + h + f);
          gy2.addColorStop(0, 'rgba(255,255,255,1)');
          gy2.addColorStop(1, 'rgba(255,255,255,0)');
          offCtx.fillStyle = gy2;
          offCtx.fillRect(x0 - f, y0 + h - f, w + f*2, f*2);
        }
      }
      offCtx.closePath();
      offCtx.globalCompositeOperation = 'source-over';

      // composite portal onto main
      ctx.drawImage(off, 0, 0);

      // draw portal outline for clarity
      ctx.save();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if(shape.value === 'circle') ctx.arc(mouse.x, mouse.y, r, 0, Math.PI*2);
      else ctx.rect(mouse.x-r, mouse.y-r, r*2, r*2);
      ctx.stroke();
      ctx.restore();

    } else if(hasEmpty && mode.value === 'wipe'){
      // compare mode: left=crowd right=empty by cursor position
      const cut = Math.round(mouse.x);
      if(hasCrowd){
        ctx.drawImage(emptyImg, cut, 0, canvas.width-cut, canvas.height, cut, 0, canvas.width-cut, canvas.height);
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(cut, 0); ctx.lineTo(cut, canvas.height);
        ctx.stroke();
        ctx.restore();
      }
    } else if(hasEmpty && mode.value === 'toggle'){
      // nothing else, base already toggles
    }

    requestAnimationFrame(draw);
  }

  // Events
  canvas.addEventListener('mousemove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
    mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
    mouse.inside = true;
  });
  canvas.addEventListener('mouseleave', () => { mouse.inside = false; });

  canvas.addEventListener('click', () => {
    if(mode.value === 'toggle') showEmptyAll = !showEmptyAll;
  });

  radius.addEventListener('input', () => radiusLabel.textContent = radius.value);
  feather.addEventListener('input', () => featherLabel.textContent = feather.value);

  fitBtn.addEventListener('click', () => {
    resizeCanvasToFit();
    setStatus('キャンバスサイズを更新しました。');
  });

  downloadBtn.addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'portal_demo.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  crowdFile.addEventListener('change', () => {
    loadImageFromFile(crowdFile, crowdImg, () => {
      hasCrowd = true;
      resizeCanvasToFit();
      setStatus('人混み画像を読み込みました。次に無人画像を読み込むと比較できます。');
    });
  });

  emptyFile.addEventListener('change', () => {
    loadImageFromFile(emptyFile, emptyImg, () => {
      hasEmpty = true;
      resizeCanvasToFit();
      setStatus('無人画像（Clean Plate）を読み込みました。キャンバス上でカーソルを動かしてください。');
    });
  });

  // init labels
  radiusLabel.textContent = radius.value;
  featherLabel.textContent = feather.value;

  draw();
})();
</script>
</body>
</html>
